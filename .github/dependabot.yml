version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 5
    groups:
      compatible-updates:
        update-types: [minor, patch]
    # uni-app packages are released as a matched toolchain; review their
    # coordinated version separately instead of accepting a partial upgrade.
    ignore:
      - dependency-name: '@dcloudio/*'
        update-types: [version-update:semver-major, version-update:semver-minor]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Chicago
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
