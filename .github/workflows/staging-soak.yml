name: Controlled staging soak
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-refs/heads/main
  cancel-in-progress: false
jobs:
  soak:
    if: github.ref == 'refs/heads/main'
    environment: staging-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app --legacy-peer-deps
      - name: Five-minute mixed reads, writes, media and realtime
        run: node scripts/staging-mixed-soak.mjs
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
          SMOKE_ACCOUNT_IS_SYNTHETIC: ${{ secrets.SMOKE_ACCOUNT_IS_SYNTHETIC }}
          SMOKE_DATASET_IS_SYNTHETIC: ${{ secrets.SMOKE_DATASET_IS_SYNTHETIC }}
          SMOKE_EXPECTED_SUPABASE_PROJECT_REF: ${{ vars.SMOKE_EXPECTED_SUPABASE_PROJECT_REF }}
          SMOKE_EXPECTED_USER_ID: ${{ vars.SMOKE_EXPECTED_USER_ID }}
